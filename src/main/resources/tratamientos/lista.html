<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Tratamientos</title></head>
<body>
<a th:href="@{/web}">Inicio</a>
<h1>Tratamientos</h1>
<a th:href="@{/web/tratamientos/nuevo}">Agregar tratamiento</a>
<table border="1">
    <tr><th>Descripción</th><th>Dosis</th><th>Cita</th><th>Acciones</th></tr>
    <tr th:each="t : ${tratamientos}">
        <td th:text="${t.descripcion}"></td>
        <td th:text="${t.dosis}"></td>
        <td th:text="${t.cita.fecha + ' - ' + t.cita.mascota.nombre}"></td>
        <td>
            <a th:href="@{/web/tratamientos/editar/{id}(id=${t.id})}">Editar</a>
            <form th:action="@{/web/tratamientos/eliminar/{id}(id=${t.id})}" method="post" style="display:inline"
                  onsubmit="return confirm('¿Eliminar este tratamiento?')">
                <button type="submit">Eliminar</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
