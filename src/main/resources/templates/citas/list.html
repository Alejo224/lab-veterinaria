<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Citas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<aside id="sidebar">
    <div class="sidebar-header">🐾 VetSystem</div>
    <ul class="sidebar-menu">
        <li><a th:href="@{/}">🏠 Inicio</a></li>
        <li><a th:href="@{/view/mascotas}">🐶 Mascotas</a></li>
        <li><a th:href="@{/view/duenos}">👤 Dueños</a></li>
        <li><a th:href="@{/view/citas}" class="active">📅 Citas</a></li>
        <li><a th:href="@{/view/tratamientos}">💊 Tratamientos</a></li>
    </ul>
</aside>

<main class="main-content">
    <div class="topbar">
        <button id="menuToggle">☰</button>
        <h1>Citas Médicas</h1>
    </div>

    <div th:if="${message}" class="alert-success" th:text="${message}"></div>

    <div class="card">
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="buscarUsuario" placeholder="Buscar cita, mascota o veterinario...">
                <span class="badge-count">Mostrando: <strong id="usuariosVisibles">0</strong></span>
            </div>
            <a th:href="@{/view/citas/form}" class="btn btn-primary">+ Nueva Cita</a>
        </div>

        <div class="table-responsive">
            <table id="tablaUsuarios">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Motivo</th>
                    <th>Mascota</th>
                    <th>Veterinario</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${citas}">
                    <td th:text="${c.id}"></td>
                    <td th:text="${c.fecha}"></td>
                    <td th:text="${c.motivo}"></td>
                    <td th:text="${c.mascota != null ? c.mascota.nombre : 'Sin mascota'}"></td>
                    <td th:text="${c.veterinario}"></td>
                    <td class="actions-cell">
                        <a th:href="@{/view/citas/edit/{id}(id=${c.id})}" class="btn btn-warning">Editar</a>
                        <form th:action="@{/view/citas/delete/{id}(id=${c.id})}" method="post" class="form-delete">
                            <button type="submit" class="btn btn-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
