<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Cita</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<aside id="sidebar">
    <div class="sidebar-header">🐾 VetSystem</div>
    <ul class="sidebar-menu">
        <li><a th:href="@{/}">🏠 Inicio</a></li>
        <li><a th:href="@{/view/mascotas}">🐶 Mascotas</a></li>
        <li><a th:href="@{/view/duenos}">👤 Dueños</a></li>
        <li><a th:href="@{/view/citas}" class="active">📅 Citas</a></li>
        <li><a th:href="@{/view/tratamientos}">💊 Tratamientos</a></li>
    </ul>
</aside>

<main class="main-content">
    <div class="topbar">
        <button id="menuToggle">☰</button>
        <h1 th:text="${citas.id == null ? 'Registrar Cita Médica' : 'Editar Cita Médica'}"></h1>
    </div>

    <div class="card form-container">
        <form th:action="@{/view/citas/save}" th:object="${citas}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="fecha">Fecha de la Cita</label>
                <input type="date" id="fecha" th:field="*{fecha}" required>
            </div>

            <div class="form-group">
                <label for="motivo">Motivo de la Consulta</label>
                <input type="text" id="motivo" th:field="*{motivo}" required>
            </div>

            <div class="form-group">
                <label for="mascota">Mascota Atendida</label>
                <select id="mascota" th:field="*{mascota.id}" required>
                    <option value="">-- Seleccione una mascota --</option>
                    <option th:each="m : ${mascotas}"
                            th:value="${m.id}"
                            th:text="${m.nombre + ' (' + m.especie + ')'}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="veterinario">Nombre del Veterinario</label>
                <input type="text" id="veterinario" th:field="*{veterinario}" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/view/citas}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
