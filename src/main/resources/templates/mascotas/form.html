<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Mascota</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<aside id="sidebar">
    <div class="sidebar-header">🐾 VetSystem</div>
    <ul class="sidebar-menu">
        <li><a th:href="@{/}">🏠 Inicio</a></li>
        <li><a th:href="@{/view/mascotas}" class="active">🐶 Mascotas</a></li>
        <li><a th:href="@{/view/duenos}">👤 Dueños</a></li>
        <li><a th:href="@{/view/citas}">📅 Citas</a></li>
        <li><a th:href="@{/view/tratamientos}">💊 Tratamientos</a></li>
    </ul>
</aside>

<main class="main-content">
    <div class="topbar">
        <button id="menuToggle">☰</button>
        <h1 th:text="${mascotas.id == null ? 'Registrar Mascota' : 'Editar Mascota'}"></h1>
    </div>

    <div class="card form-container">
        <form th:action="@{/view/mascotas/save}" th:object="${mascotas}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="nombre">Nombre de la Mascota</label>
                <input type="text" id="nombre" th:field="*{nombre}" required>
            </div>

            <div class="form-group">
                <label for="especie">Especie (Perro, Gato, Conejo...)</label>
                <input type="text" id="especie" th:field="*{especie}" required>
            </div>

            <div class="form-group">
                <label for="raza">Raza</label>
                <input type="text" id="raza" th:field="*{raza}" required>
            </div>

            <div class="form-group">
                <label for="edad">Edad (años)</label>
                <input type="number" id="edad" th:field="*{edad}" min="0" required>
            </div>

            <div class="form-group">
                <label for="dueno">Dueño</label>
                <select id="dueno" th:field="*{dueno.id}" required>
                    <option value="">-- Seleccione un dueño --</option>
                    <option th:each="d : ${duenos}" th:value="${d.id}" th:text="${d.nombre}"></option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/view/mascotas}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
