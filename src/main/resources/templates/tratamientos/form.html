<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Tratamiento</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<aside id="sidebar">
    <div class="sidebar-header">🐾 VetSystem</div>
    <ul class="sidebar-menu">
        <li><a th:href="@{/}">🏠 Inicio</a></li>
        <li><a th:href="@{/view/mascotas}">🐶 Mascotas</a></li>
        <li><a th:href="@{/view/duenos}">👤 Dueños</a></li>
        <li><a th:href="@{/view/citas}">📅 Citas</a></li>
        <li><a th:href="@{/view/tratamientos}" class="active">💊 Tratamientos</a></li>
    </ul>
</aside>

<main class="main-content">
    <div class="topbar">
        <button id="menuToggle">☰</button>
        <h1 th:text="${tratamientos.id == null ? 'Registrar Tratamiento' : 'Editar Tratamiento'}"></h1>
    </div>

    <div class="card form-container">
        <form th:action="@{/view/tratamientos/save}" th:object="${tratamientos}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="descripcion">Medicamento o Procedimiento</label>
                <input type="text" id="descripcion" th:field="*{descripcion}" required>
            </div>

            <div class="form-group">
                <label for="dosis">Detalle de Dosis o Frecuencia</label>
                <input type="text" id="dosis" th:field="*{dosis}" required>
            </div>

            <div class="form-group">
                <label for="cita">Cita en la que se Aplicó</label>
                <select id="cita" th:field="*{cita.id}" required>
                    <option value="">-- Seleccione una cita --</option>
                    <option th:each="c : ${citas}"
                            th:value="${c.id}"
                            th:text="${'Cita #' + c.id + ' - ' + c.fecha + ' (' + c.mascota.nombre + ')'}"></option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/view/tratamientos}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
